query GetAllEthCollateral($lastId: ID) {
  userReserves(
    where: {
      # Base 链 WETH Reserve ID
      reserve: "0x42000000000000000000000000000000000000060xe20fcbdbffc4dd138ce8b2e6fbb6cb49777ad64d",
      usageAsCollateralEnabledOnUser: true,
      currentATokenBalance_gt: "0",
      id_gt: $lastId
    }
    first: 1000
    orderBy: id
    orderDirection: asc
  ) {
    id
    user {
      id
    }
    currentATokenBalance
  }
}