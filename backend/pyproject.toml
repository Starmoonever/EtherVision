[project]
name = "aave-crawler"
version = "0.1.0"
description = "Aave V3 Base 仓位批量查询 & 持久化"
requires-python = ">=3.12"
dependencies = [
    "web3>=7.0.0",
    "asyncpg>=0.30.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "tqdm>=4.67",
    "numpy>=2.4.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "clickhouse-connect>=0.8",
]

[project.scripts]
api = "crawler_shared.server:main"
aave-crawler = "aave_crawler.cli:cli"
compound-crawler = "compound_crawler.cli:cli"
justlend-crawler = "justlend_crawler.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aave_crawler", "compound_crawler", "crawler_shared", "justlend_crawler"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
    "types-tqdm>=4.67",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:websockets\\.legacy is deprecated:DeprecationWarning:websockets\\.legacy",
]
